# Template for tropia-secrets. Copy to secrets.yaml (DO NOT commit) and
# fill in real values, then `kubectl apply -f secrets.yaml`.
#
# Generate JWT secrets with:
#   openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: tropia-secrets
  namespace: tropia
type: Opaque
stringData:
  # Postgres
  postgres-user:     tropia
  postgres-password: CHANGE_ME
  POSTGRES_USER:     tropia
  POSTGRES_PASSWORD: CHANGE_ME

  # JWT
  JWT_ACCESS_SECRET:  CHANGE_ME_64_HEX
  JWT_REFRESH_SECRET: CHANGE_ME_64_HEX

  # Cloudflare R2
  R2_ACCOUNT_ID:        CHANGE_ME
  R2_ACCESS_KEY_ID:     CHANGE_ME
  R2_SECRET_ACCESS_KEY: CHANGE_ME
  R2_BUCKET:            tropia-vod
  R2_PUBLIC_URL:        https://vod.tropia.vn

  # Google OAuth
  GOOGLE_CLIENT_ID:     ""
  GOOGLE_CLIENT_SECRET: ""
  GOOGLE_REDIRECT_URL:  https://api.tropia.vn/api/auth/google/callback
  GOOGLE_APP_DEEP_LINK: tropia://auth/callback

  # Payment
  MOMO_PARTNER_CODE: MOMO
  MOMO_ACCESS_KEY:   ""
  MOMO_SECRET_KEY:   ""
  MOMO_API_URL:      https://payment.momo.vn
  MOMO_REDIRECT_URL: https://api.tropia.vn/api/payment/momo/callback
  MOMO_IPN_URL:      https://api.tropia.vn/api/payment/momo/ipn

  VNP_TMN_CODE:     ""
  VNP_HASH_SECRET:  ""
  VNP_URL:          https://pay.vnpay.vn/paymentv2/vpcpay.html
  VNP_RETURN_URL:   https://api.tropia.vn/api/payment/vnpay/return

  ZALOPAY_APP_ID:        ""
  ZALOPAY_KEY1:          ""
  ZALOPAY_KEY2:          ""
  ZALOPAY_API_CREATE:    https://openapi.zalopay.vn/v2/create
  ZALOPAY_API_QUERY:     https://openapi.zalopay.vn/v2/query
  ZALOPAY_CALLBACK_URL:  https://api.tropia.vn/api/payment/zalopay/callback
  ZALOPAY_REDIRECT_URL:  https://tropia.vn/payment-result

  # DeepSeek AI
  DEEPSEEK_API_KEY: ""

  # SMTP email
  EMAIL_HOST:      smtp.gmail.com
  EMAIL_PORT:      "587"
  EMAIL_USERNAME:  ""
  EMAIL_PASSWORD:  ""
  EMAIL_FROM_NAME: Tropia

  # Client URL (for payment redirect)
  CLIENT_URL: https://tropia.vn
