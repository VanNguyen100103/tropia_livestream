# NetworkPolicy baseline — applies a default-deny ingress, then opens
# only the flows the app actually needs. Requires a CNI that implements
# NetworkPolicy (Calico, Cilium, Antrea — Flannel alone does not).
#
# Egress is left unrestricted; the backend needs outbound to
# api.deepseek.com, payment gateways, Cloudflare R2, and SMTP. Lock
# egress down with a separate policy if you can enumerate those.

# 1. Default-deny: every pod in the namespace blocks ingress unless an
#    explicit allow rule below opens a port for it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tropia
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# 2. Backend: reachable from ingress-nginx (public traffic) and from
#    Prometheus (which scrapes /metrics from the same port).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-ingress
  namespace: tropia
spec:
  podSelector:
    matchLabels: { app: backend }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { port: 3000, protocol: TCP }
    - from:
        - podSelector:
            matchLabels: { app: prometheus }
      ports:
        - { port: 3000, protocol: TCP }
---
# 3. PgBouncer: only backend + worker may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pgbouncer-ingress
  namespace: tropia
spec:
  podSelector:
    matchLabels: { app: pgbouncer }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: backend } }
        - podSelector: { matchLabels: { app: worker } }
      ports:
        - { port: 6432, protocol: TCP }
---
# 4. Postgres: only pgbouncer may connect (no direct backend access).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
  namespace: tropia
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: pgbouncer } }
        # Worker bypasses pgbouncer for long-running migrations / DDL.
        - podSelector: { matchLabels: { app: worker } }
      ports:
        - { port: 5432, protocol: TCP }
---
# 5. Redis: backend + worker only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-ingress
  namespace: tropia
spec:
  podSelector:
    matchLabels: { app: redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: backend } }
        - podSelector: { matchLabels: { app: worker } }
      ports:
        - { port: 6379, protocol: TCP }
---
# 6. SRS: RTMP/SRT/WHIP publish is exposed by ingress-nginx (TCP 1935
#    + UDP 8000). HLS playback from backend goes through hls-proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-srs-ingress
  namespace: tropia
spec:
  podSelector:
    matchLabels: { app: srs }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { port: 1935, protocol: TCP } # RTMP
        - { port: 1985, protocol: TCP } # HTTP-API / WHIP
        - { port: 8080, protocol: TCP } # HLS (proxied)
        - { port: 8000, protocol: UDP } # SRT
    - from:
        - podSelector: { matchLabels: { app: backend } }
        - podSelector: { matchLabels: { app: hls-proxy } }
      ports:
        - { port: 1985, protocol: TCP }
        - { port: 8080, protocol: TCP }
