# PgBouncer — transaction-mode connection pooler in front of Postgres.
#
# Why: pgx.Pool in each backend pod opens up to 200 connections. With 3
# replicas that's 600 Postgres backends — Postgres itself struggles past
# ~300 backends (each ≈10MB RAM + context switching). PgBouncer in
# transaction mode multiplexes those 600 client conns onto ~30-50 real
# Postgres backends. Same end-to-end throughput, far less Postgres
# memory.
#
# Trade-offs (transaction mode):
# - Cannot use session-level features (LISTEN/NOTIFY, prepared
#   statements bound to a session). Tropia's queries are stateless so
#   this is fine.
# - SET LOCAL, advisory locks must stay inside one transaction.

apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: tropia
data:
  pgbouncer.ini: |
    [databases]
    tropia = host=postgres port=5432 dbname=tropia

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    # Each backend pod owns at most this many actual Postgres conns
    # through the pooler. With 3 pods × 50 = 150 real backends → fits
    # well under Postgres max_connections=300.
    max_client_conn = 1000
    default_pool_size = 50
    reserve_pool_size = 10
    reserve_pool_timeout = 5
    server_lifetime = 3600
    server_idle_timeout = 600
    # Hide pgbouncer's own admin DB from random clients.
    admin_users = pgbouncer_admin
    stats_users = pgbouncer_stats
    # Log every connection (debug). Drop to 0 once stable.
    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1
    # Match Postgres timezone so app sees consistent timestamps.
    server_tls_sslmode = disable

  # userlist.txt format: "username" "scram-hash"
  # Replace the hash with the actual scram-sha-256 hash for the tropia
  # user. Generate with:
  #   echo -n "tropia_dev_password" | \
  #     openssl dgst -sha256 -hmac "$salt" -binary | base64
  # Or simpler: connect to Postgres once, then run:
  #   SELECT rolname, rolpassword FROM pg_authid WHERE rolname='tropia';
  # and copy the SCRAM-SHA-256$… string into the second column.
  userlist.txt: |
    "tropia" "SCRAM-SHA-256$REPLACE_WITH_REAL_HASH"
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: tropia
spec:
  selector:
    app: pgbouncer
  ports:
    - port: 6432
      targetPort: 6432
      name: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: tropia
spec:
  # 2 replicas so a rolling restart doesn't drop all DB traffic. Both
  # talk to the same Postgres primary — pooling is stateless.
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:1.23.1
          ports:
            - containerPort: 6432
              name: postgres
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: pgbouncer-config
