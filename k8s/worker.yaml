# Background worker — consumes Redis Streams events published by the api.
# Same image as the api Deployment, just runs `worker` binary instead.
#
# Scale separately from the api via `kubectl scale deployment worker --replicas=N`.
# Each replica registers under consumer name `worker-N` so Redis Streams
# distributes events round-robin within each consumer group.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: tropia
  labels:
    app: worker
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # Same uid as backend.yaml (matches the `app` user in
      # backend/Dockerfile). The FFmpeg remux pipeline writes to /tmp
      # which is an emptyDir mount, so even with readOnlyRootFilesystem
      # the worker can stage VOD files before uploading to R2.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # Pin to a digest in CI (see backend.yaml comment).
          image: tropia/backend:dev
          imagePullPolicy: IfNotPresent
          command: ["/app/worker"]    # override the api entrypoint
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef:    { name: tropia-secrets }
          env:
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/tropia?sslmode=disable
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          # No HTTP server → liveness probe by running `/app/worker --healthcheck`
          # is overkill for now. Add later if worker grows complex.
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }   # FFmpeg remux scratch space
