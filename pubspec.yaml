name: tropia
description: Tropia - Ứng dụng mua sắm thực phẩm tươi sống và hàng tạp hoá Việt Nam với tính năng Live Shopping
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # HTTP client
  dio: ^5.4.0

  # Video player
  video_player: ^2.8.2
  chewie: ^1.7.4

  # Camera
  camera: ^0.11.0
  permission_handler: ^11.3.1

  # UI components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Animations
  lottie: ^3.1.0

  # Utilities
  intl: ^0.19.0
  timeago: ^3.6.1
  uuid: ^4.3.3
  logger: ^2.2.0

  # Agora (Live streaming)
  agora_rtc_engine: ^6.5.3

  # Media picker
  image_picker: ^1.1.2

  # Local storage
  shared_preferences: ^2.2.2

  # Icons & SVG
  flutter_svg: ^2.0.10+1
  font_awesome_flutter: ^10.7.0
  url_launcher: ^6.3.2
  app_links: ^7.0.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4
  shared_preferences: ^2.2.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
