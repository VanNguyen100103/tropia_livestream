openapi: 3.1.0
info:
  title: Tropia Live API
  version: 1.0.0
  description: |
    REST API for the Tropia Live shopping platform.

    All authenticated endpoints require a `Authorization: Bearer <jwt>`
    header. Refresh tokens live in the HttpOnly `refresh_token` cookie
    set on `/api/auth/login` and rotated on `/api/auth/refresh`.

    **OWASP API Security Top 10 compliance:**
    - API1 (BOLA): ownership checks on every mutate endpoint.
    - API2 (Broken Auth): bcrypt cost 12, refresh rotation + reuse
      detection, sliding-window rate-limit (Redis Lua).
    - API3 (Mass Assignment): registration role is whitelisted to
      buyer/seller only; admin must be promoted DB-side.
    - API4 (Resource Consumption): pagination caps, 5MB upload cap,
      DeepSeek bot quota 30/hour/session.
    - API5 (BFLA): admin/seller middleware applied per route.
    - API6 (Sensitive Flow): orders 20/min/user, like 60/min/IP, chat
      30/min/user, login 5/min/IP.
    - API8 (Misconfig): CORS whitelist, security headers, GIN_MODE
      enforcement, dev-only fields gated.
    - API9 (Inventory): this spec.
    - API10 (Unsafe Consumption): HTTP client timeouts on outbound
      MoMo/ZaloPay/DeepSeek calls.
  contact:
    name: Tropia Backend Team
servers:
  - url: https://api.tropia.vn
    description: Production
  - url: http://localhost:3000
    description: Local dev

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_FAILED
        error:
          type: string
          example: email format invalid

    User:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [buyer, seller, admin]
        avatar_url:
          type: string
          format: uri
          nullable: true
        phone:
          type: string
          nullable: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Must contain uppercase + digit.
        name:
          type: string
        phone:
          type: string
        shop_name:
          type: string
        role:
          type: string
          enum: [buyer, seller]
          description: |
            Self-service can only request buyer or seller. Any other
            value (including `admin`) is silently coerced to `buyer`.
            This is the OWASP API3 (Mass Assignment) defense — admins
            must be promoted via DB-side migration, never via API.

    LiveSession:
      type: object
      required: [id, seller_id, title, status]
      properties:
        id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        shop_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [scheduled, live, ended]
        viewer_count:
          type: integer
        like_count:
          type: integer
        follow_count:
          type: integer
        playback_hls:
          type: string
          format: uri
          description: Cloudflare/nginx-proxied HLS URL. Stream key scrubbed.
        products:
          type: array
          items:
            $ref: '#/components/schemas/LiveProduct'

    LiveProduct:
      type: object
      required: [id, product_name, sale_price]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
          nullable: true
        product_name:
          type: string
        image_url:
          type: string
          format: uri
        original_price:
          type: number
        sale_price:
          type: number
        discount_pct:
          type: number
        stock_left:
          type: integer
        is_pinned:
          type: boolean

    ChatMessage:
      type: object
      required: [id, session_id, user_id, username, message, type, created_at]
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        username:
          type: string
        avatar_url:
          type: string
          nullable: true
        message:
          type: string
        type:
          type: string
          enum: [text, emoji, system, bot, bot_error]
        is_host:
          type: boolean
          nullable: true
        created_at:
          type: string
          format: date-time

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Create a new buyer or seller account
      description: |
        Rate-limited to 3 requests / 5 min / IP. OTP is emailed
        asynchronously; account is locked until `/verify-otp` succeeds.
        Role field is whitelisted — `admin` requests are coerced to
        `buyer`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created. OTP sent via email.
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Email already registered
        '429':
          description: Too many requests (3/5min)

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Exchange credentials for JWT + refresh cookie
      description: Rate-limited to 5/min/IP. Locks account after 5 failed attempts for 15 min.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Access token + user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Invalid credentials
        '423':
          description: Account locked (too many failed attempts)
        '429':
          description: Rate limited

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token, mint new access token
      description: |
        Reads the refresh token from the `refresh_token` cookie. If the
        same refresh token is presented twice (reuse), the entire token
        family is revoked — defense against stolen refresh tokens.
      security: []
      responses:
        '200':
          description: New access + refresh
        '401':
          description: Invalid/expired refresh

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /api/live/streams:
    get:
      tags: [Live]
      summary: List active live sessions
      description: |
        Public endpoint. Response is cached in Redis for 3s to coalesce
        the polling burst from concurrent viewers. Each session embeds
        its pinned products inline (batch fetched — no N+1).
      security: []
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/LiveSession' }
    post:
      tags: [Live]
      summary: Create a new live session (seller only)
      description: Returns RTMP/WHIP/SRT publish URLs that include the stream key.
      responses:
        '201':
          description: Session created with publish URLs
        '403':
          description: Not a seller

  /api/live/streams/{id}:
    get:
      tags: [Live]
      summary: Get one session
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Session detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: '#/components/schemas/LiveSession' }
        '404':
          description: Not found

  /api/live/streams/{id}/playback:
    get:
      tags: [Live]
      summary: Get playback URLs (HLS / FLV / WHEP)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: URLs

  /api/live/streams/{id}/stats:
    get:
      tags: [Live]
      summary: Live counters (viewers, likes, follows)
      description: Counts are sourced realtime from `live_viewers` / `live_session_follows`, not the cached column.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Stats

  /api/live/streams/{id}/chat:
    get:
      tags: [Live]
      summary: Last N chat messages
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/ChatMessage' }
    post:
      tags: [Live]
      summary: Post a chat message
      description: Rate-limited 30/min/user. Triggers DeepSeek auto-reply when ai_bot_enabled + heuristic matches.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Posted
        '429':
          description: Rate limited

  /api/live/streams/{id}/like:
    post:
      tags: [Live]
      summary: Increment like count (anonymous OK)
      description: Rate-limited 60/min/IP to stop bot inflation.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Liked
        '429':
          description: Rate limited

  /api/live/streams/{id}/end:
    post:
      tags: [Live]
      summary: Host ends the stream
      description: Owner-only. Sets `status='ended'` permanently.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Ended
        '404':
          description: Not your stream (BOLA returns 404, not 403)

  /api/live/streams/{id}/products:
    get:
      tags: [Live]
      summary: List pinned products
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Products
    post:
      tags: [Live]
      summary: Pin products (seller only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updated product list
    put:
      tags: [Live]
      summary: Replace the entire pinned set
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: New list

  /api/live/streams/{id}/products/{productId}:
    delete:
      tags: [Live]
      summary: Unpin one product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Removed

  /api/orders:
    post:
      tags: [Orders]
      summary: Place an order from a live stream
      description: Rate-limited 20/min/user (stops stolen-token abuse).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [live_product_id, quantity]
              properties:
                live_product_id:
                  type: string
                  format: uuid
                quantity:
                  type: integer
                  minimum: 1
                coupon_code:
                  type: string
      responses:
        '201':
          description: Order created
        '429':
          description: Rate limited

  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get one order (buyer or admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order detail
        '404':
          description: Not your order (BOLA returns 404)

  /api/shops/{slug}:
    get:
      tags: [Shops]
      summary: Public shop page
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Shop

  /api/shops/{slug}/follow:
    post:
      tags: [Shops]
      summary: Follow shop (idempotent)
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Following
    delete:
      tags: [Shops]
      summary: Unfollow
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Unfollowed

  /api/shops/me/following:
    get:
      tags: [Shops]
      summary: Shops the authenticated user follows
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Following list

  /api/upload/avatar:
    post:
      tags: [Upload]
      summary: Upload user avatar (5MB max, jpg/png/webp)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: R2 URL

  /api/upload/product:
    post:
      tags: [Upload]
      summary: Upload product images (seller only, owner-only)
      description: |
        Verifies the authenticated seller owns `product_id` before
        accepting the upload — OWASP API1 (BOLA) defense.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [product_id, images]
              properties:
                product_id:
                  type: string
                  format: uuid
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: URLs
        '404':
          description: Product not yours

  /health:
    get:
      tags: [System]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: ok

  /metrics:
    get:
      tags: [System]
      summary: Prometheus metrics
      description: Bearer-token gated (METRICS_TOKEN env). Not for public scraping.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Metrics in Prometheus exposition format
        '401':
          description: Missing/invalid token
