name: tropia
description: Tropia - Ứng dụng mua sắm thực phẩm tươi sống và hàng tạp hoá Việt Nam với tính năng Live Shopping
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # HTTP client
  dio: ^5.4.0
  # SHA-256 for PKCE code_challenge derivation. Already a transitive dep
  # of dio/video_player; promote to direct so the import is intentional.
  crypto: ^3.0.3

  # Video player
  video_player: ^2.8.2
  chewie: ^1.7.4
  # HLS playback on Chrome / Firefox / Edge — those browsers can't decode
  # HLS natively, so HlsViewer's web impl uses package:web + hls.js (loaded
  # in web/index.html) via dart:js_interop. Safari + iOS skip hls.js and
  # use <video src=*.m3u8> directly.
  web: ^1.1.0
  # Realtime chat + stats push from backend (replaces 3s/5s polling).
  # web_socket_channel auto-uses native WebSocket on web and dart:io on
  # mobile, so the same import works cross-platform.
  web_socket_channel: ^3.0.1
  # Only autoplay card previews when scrolled into view (saves bandwidth +
  # CPU on long lists).
  visibility_detector: ^0.4.0+2

  # Camera (preview + photo capture)
  camera: ^0.11.0
  permission_handler: ^11.3.1

  # Live streaming — RTMP publish from phone camera to SRS (Shopee Live style)
  apivideo_live_stream: ^1.2.0

  # Face detection for AR sticker overlay (tai thỏ / tai mèo trên live).
  # Android + iOS only — Flutter Web doesn't ship Google ML Kit, so the
  # sticker UI is gated behind kIsWeb checks. Buyer-side viewers never
  # see the filter (RTMP push is raw camera frame), this is preview-only.
  google_mlkit_face_detection: ^0.13.0

  # UI components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Animations
  lottie: ^3.1.0

  # Utilities
  intl: ^0.19.0
  timeago: ^3.6.1
  uuid: ^4.3.3
  logger: ^2.2.0

  # Media picker
  image_picker: ^1.1.2

  # Local storage
  shared_preferences: ^2.2.2
  # Native secure storage for auth tokens — Keychain (iOS / macOS),
  # EncryptedSharedPreferences via AndroidX Security (Android),
  # webcrypto-wrapped IndexedDB (web), libsecret (Linux). Replaces
  # plaintext SharedPreferences for JWT access/refresh tokens.
  flutter_secure_storage: ^9.2.2

  # Icons & SVG
  flutter_svg: ^2.0.10+1
  font_awesome_flutter: ^10.7.0
  url_launcher: ^6.3.2
  app_links: ^7.0.0
  share_plus: ^10.0.0
  pointer_interceptor: ^0.10.1+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4
  shared_preferences: ^2.2.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
