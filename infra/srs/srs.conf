# SRS config for Tropia Live MVP
# Reference: https://github.com/ossrs/srs/wiki

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
srs_log_level       info;

# HTTP API (status, control)
http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

# HTTP server (serves HLS + HTTP-FLV)
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

# Stats endpoint (Prometheus-compatible)
stats {
    network         0;
}

# RTC (WebRTC) - WHIP/WHEP support
rtc_server {
    enabled         on;
    listen          8000;   # UDP
    candidate       $CANDIDATE;
}

# SRT (low-latency professional ingest)
srt_server {
    enabled         on;
    listen          10080;
    maxbw           1000000000;
}

# Default vhost
vhost __defaultVhost__ {
    # RTMP -> HLS conversion. Tuned for smooth playback in the buyer
    # viewer; not chasing absolute minimum latency.
    #
    # Glass-to-glass latency: ~5-8s typical
    #   (capture+encode ~1s + 2s segment + 3-segment startup buffer)
    # The previous config (1s/4s) was sub-3s but jittery — hls.js had to
    # chase the live edge segment-by-segment and any network blip caused
    # visible stutter on Chrome.
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        # SRS 5 defaults hls_ctx/hls_ts_ctx to ON: the first .m3u8 fetch
        # (no ?hls_ctx) returns a bootstrap MASTER playlist that points
        # back at the same URL with ?hls_ctx=<id>, and only that second
        # fetch yields the real media playlist. Our Go HLS proxy
        # (internal/live/hls_proxy.go) assumes SRS serves the media
        # playlist directly — it rewrites <key>-<seq>.ts refs to opaque
        # /s/<seq>.ts paths. The bootstrap master has no .ts refs and
        # trips isSRSPlaceholderMaster() (BANDWIDTH=1 sentinel), so the
        # proxy 404s every live stream → "Lỗi phát video". Turn both off
        # so SRS serves the media playlist on the first request.
        hls_ctx         off;
        hls_ts_ctx      off;
        hls_fragment    2;     # 2-second segments — fewer playlist
                               # reloads, more decoder slack per segment.
        hls_window      60;    # keep 60s of segments live (30 segments
                               # at 2s each). 20s was too aggressive —
                               # card previews that woke from off-screen
                               # and viewers joining a stream mid-flight
                               # routinely requested a .ts that SRS had
                               # already purged, surfacing as 404
                               # fragLoadError → "Lỗi phát video". 60s
                               # gives slow / backgrounded clients
                               # generous room to catch up without
                               # adding playback latency (the live edge
                               # is unchanged).
        hls_td_ratio    1.5;   # target duration = 1.5 × fragment
        hls_aof_ratio   2.0;   # flush segment to disk earlier
        # Wait for a keyframe before starting a new .ts segment. Without
        # this, SRS splits at the fragment boundary regardless of GOP,
        # so every segment starts mid-GOP and gets tagged with
        # #EXT-X-DISCONTINUITY. hls.js then re-inits the decoder on
        # every segment boundary → player stalls + "Lỗi phát video"
        # after ~30s of accumulating discontinuities.
        hls_wait_keyframe on;
        # On a muxing error, keep serving HLS instead of disconnecting
        # the publisher (a transient write hiccup shouldn't kill the stream).
        hls_on_error continue;
        hls_cleanup     on;
        hls_dispose     30;    # auto-cleanup 30s after publisher leaves
    }

    # HTTP-FLV (alternative live protocol)
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # WebRTC config
    rtc {
        enabled     on;
        rtmp_to_rtc on;     # auto-convert RTMP to WebRTC
        rtc_to_rtmp on;     # auto-convert WebRTC (WHIP) to RTMP
    }

    # SRT config
    srt {
        enabled     on;
        srt_to_rtmp on;
    }

    # Webhooks to Go backend.
    # The `?secret=…` query string must match SRS_WEBHOOK_SECRET on the
    # backend side. Without it any attacker who can reach the backend
    # webhook port could forge `on_publish` / `on_dvr` events. For dev,
    # set both sides to the same string (e.g. "dev-secret"); for prod,
    # use a high-entropy value injected via secret manager.
    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:3000/api/srs/on_publish?secret=dev-secret;
        on_unpublish    http://host.docker.internal:3000/api/srs/on_unpublish?secret=dev-secret;
        on_play         http://host.docker.internal:3000/api/srs/on_play?secret=dev-secret;
        on_stop         http://host.docker.internal:3000/api/srs/on_stop?secret=dev-secret;
        on_dvr          http://host.docker.internal:3000/api/srs/on_dvr?secret=dev-secret;
    }

    # DVR (record stream to FLV for VOD)
    dvr {
        enabled         on;
        dvr_apply       all;
        dvr_path        ./objs/nginx/html/dvr/[app]/[stream].[timestamp].flv;
        dvr_plan        session;   # one file per session
    }
}
