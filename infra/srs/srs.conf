# SRS config for Tropia Live MVP
# Reference: https://github.com/ossrs/srs/wiki

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
srs_log_level       info;

# HTTP API (status, control)
http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

# HTTP server (serves HLS + HTTP-FLV)
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

# Stats endpoint (Prometheus-compatible)
stats {
    network         0;
}

# RTC (WebRTC) - WHIP/WHEP support
rtc_server {
    enabled         on;
    listen          8000;   # UDP
    candidate       $CANDIDATE;
}

# SRT (low-latency professional ingest)
srt_server {
    enabled         on;
    listen          10080;
    maxbw           1000000000;
}

# Default vhost
vhost __defaultVhost__ {
    # RTMP -> HLS conversion (low-latency HLS via short segments)
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;     # 2-second segments
        hls_window      30;    # keep 30s window
        hls_cleanup     on;
        hls_dispose     30;    # auto-cleanup 30s after publisher leaves
    }

    # HTTP-FLV (alternative live protocol)
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # WebRTC config
    rtc {
        enabled     on;
        rtmp_to_rtc on;     # auto-convert RTMP to WebRTC
        rtc_to_rtmp on;     # auto-convert WebRTC (WHIP) to RTMP
    }

    # SRT config
    srt {
        enabled     on;
        srt_to_rtmp on;
    }

    # Webhooks to Go backend
    # SRS will POST events here so backend knows stream lifecycle
    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:3000/api/srs/on_publish;
        on_unpublish    http://host.docker.internal:3000/api/srs/on_unpublish;
        on_play         http://host.docker.internal:3000/api/srs/on_play;
        on_stop         http://host.docker.internal:3000/api/srs/on_stop;
        on_dvr          http://host.docker.internal:3000/api/srs/on_dvr;
    }

    # DVR (record stream to FLV for VOD)
    dvr {
        enabled         on;
        dvr_apply       all;
        dvr_path        ./objs/nginx/html/dvr/[app]/[stream].[timestamp].flv;
        dvr_plan        session;   # one file per session
    }
}
