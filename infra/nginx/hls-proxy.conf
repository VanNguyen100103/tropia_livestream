worker_processes auto;
events { worker_connections 1024; }

http {
    # Upstream pool to SRS — nginx keeps these alive across requests so
    # the per-request `Connection: close` SRS sends never reaches the
    # viewer. `keepalive 32` means up to 32 idle sockets ready to reuse
    # per worker.
    upstream srs_hls {
        server srs:8080;
        keepalive 32;
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }

    # In-memory cache so the playlist + most-recent segments only hit
    # SRS once per polling viewer. Short TTL for the playlist (which
    # changes every segment), longer TTL for .ts blobs (immutable).
    proxy_cache_path /tmp/hls_cache levels=1:2 keys_zone=hls:10m
                     max_size=200m inactive=5m use_temp_path=off;

    access_log off;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 8090;
        server_name _;

        # Always serve CORS so Flutter web (which fetches segments via
        # XHR through hls.js) can read response bodies.
        add_header Access-Control-Allow-Origin   * always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Range, Accept' always;
        add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;

        # m3u8 playlist — changes every ~hls_fragment seconds, cache 1s
        # so concurrent viewers coalesce onto a single upstream fetch.
        location ~ \.m3u8$ {
            proxy_pass http://srs_hls;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering on;
            proxy_cache hls;
            proxy_cache_valid 200 1s;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # .ts segment — immutable for the life of the live window;
        # cache for 30s (SRS rotates them after hls_window anyway).
        location ~ \.ts$ {
            proxy_pass http://srs_hls;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 16 32k;
            proxy_cache hls;
            proxy_cache_valid 200 30s;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # Anything else (favicon, /api probes, ...) — pass through
        # uncached so we don't accidentally serve stale content from a
        # path we haven't tuned.
        location / {
            proxy_pass http://srs_hls;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
